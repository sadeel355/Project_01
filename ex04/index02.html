<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل مستخدم جديد</title>
</head>
<body>
    <form action="#" method="POST">
        <div>
            <label for="fullname">الاسم الكامل:</label>
            <input type="text" id="fullname" name="fullname" required minlength="3">
        </div>
        <div>
            <label for="email">البريد الإلكتروني:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="password">كلمة المرور:</label>
            <input type="password" id="password" name="password" required minlength="6">
        </div>
        <div>
            <label>الجنس:</label>
            <input type="radio" id="gender-male" name="gender" value="male" required>
            <label for="gender-male">ذكر</label>
            <input type="radio" id="gender-female" name="gender" value="female">
            <label for="gender-female">أنثى</label>
        </div>
        <div>
            <label for="country">الدولة:</label>
            <select id="country" name="country" required>
                <option value="" disabled selected>اختر الدولة</option>
                <option value="jo">الأردن</option>
                <option value="sa">السعودية</option>
            </select>
        </div>
        <div>
            <label for="bio">نبذة تعريفية:</label>
            <textarea id="bio" name="bio" rows="4" minlength="10"></textarea>
        </div>
        <div>
            <input type="checkbox" id="agreement" name="agreement" required>
            <label for="agreement">أوافق على الشروط والأحكام</label>
        </div>
        <button type="submit">تسجيل</button>
    </form>
</body>
</html>
