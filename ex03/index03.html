<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lists and Tables</title>
    </head>
    <body>
        <h1>My Web Development Skills</h1>

        <h2>Ordered List of Steps</h2>
        <ol>
            <li>Learn HTML Fundamentals</li>
            <li>Master CSS Styling</li>
            <li>Understand JavaScript Basics</li>
        </ol>

        <h2>Skills Comparison Table</h2>
        <table border="1">
            <thead>
                <tr>
                    <th>Technology</th>
                    <th>Difficulty</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>HTML</td>
                    <td>Easy</td>
                    <td>Completed</td>
                </tr>
                <tr>
                    <td>CSS</td>
                    <td>Medium</td>
                    <td>In Progress</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
